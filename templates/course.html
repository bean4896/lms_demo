<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.code }} – {{ course.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="site-nav">
        <a href="{{ url_for('index') }}" class="nav-brand">LMS Resource Finder</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="nav-link">Home</a></li>
            <li><a href="{{ url_for('course_page', course_id=course.id) }}" class="nav-link active">{{ course.code }}</a></li>
        </ul>
    </nav>
    <div class="page course-page">
        <header class="header">
            <div class="header-top">
                <a href="{{ url_for('manage_resources', course_id=course.id) }}" class="manage-link">Manage resources</a>
                <h1>{{ course.code }} – {{ course.name }}</h1>
            </div>
            <!-- Global search bar: prominent, no scroll needed -->
            <div class="search-wrap">
                <label for="global-search" class="sr-only">Search resources</label>
                <input type="text"
                       id="global-search"
                       class="global-search"
                       placeholder="Search lectures, recordings, tutorials, assignments, projects (e.g. lec 01, recording, week 02)"
                       autocomplete="off"
                       aria-label="Global resource search">
                <span class="search-status" id="search-status" aria-live="polite"></span>
            </div>
        </header>
        <main class="main">
            <section class="results-section" id="results-section">
                <div class="results-box" id="results-box">
                    <h2 class="results-heading" id="results-heading">Search results</h2>
                    <ul class="results-list" id="results-list"></ul>
                </div>
                <div class="recommendations-box" id="recommendations-box">
                    <h3 class="rec-heading">Related resources</h3>
                    <ul class="recommendations-list" id="recommendations-list"></ul>
                </div>
            </section>
            <p class="hint" id="hint">Type in the search bar to find resources. Try "lecture 01", "recording", "week 02", or "assignment".</p>
        </main>
    </div>
    <script>
        window.LMS_COURSE_ID = "{{ course.id }}";
        window.LMS_SEARCH_URL = "{{ url_for('api_search', course_id=course.id) }}";
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
